<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Irish Conversation Practice</title><style>:root{font:16px system-ui,Segoe UI,sans-serif;color:#172235;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:28px}h1{margin:0 0 8px;font-size:clamp(30px,5vw,44px)}.sub{color:#64748b}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}.filters button{font:inherit;padding:9px 13px;background:white;border:1px solid #cbd5e1;border-radius:10px;cursor:pointer}.filters button.active{background:#234fbb;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.card{background:white;border:1px solid #dce3ee;border-radius:16px;padding:20px;box-shadow:0 8px 24px #2030520b}.card h2{font-size:20px}.card p{color:#64748b}.pill{font-size:12px;color:#234fbb;background:#eef4ff;padding:5px 9px;border-radius:15px}.go{display:inline-block;margin-top:12px;background:#234fbb;color:white;text-decoration:none;padding:10px 15px;border-radius:9px}input{padding:11px;border:1px solid #cad4e4;border-radius:9px;font:inherit;width:100%;max-width:420px;margin-top:20px}.support-top{display:inline-block;margin:14px 0;color:#234fbb;font-weight:600;text-decoration:none}.support-box{margin:35px auto 0;max-width:650px;text-align:center;background:white;border:1px solid #dce3ee;border-radius:16px;padding:25px}.support-box p{color:#64748b}.support-box a{display:inline-block;padding:11px 18px;background:#234fbb;color:white;text-decoration:none;border-radius:9px}.support-box[hidden],.support-top[hidden]{display:none}</style></head><body><main class="wrap"><h1 id="title"></h1><div class="sub" id="subtitle"></div><div><a class="support-top" id="supportTop" target="_blank" rel="noopener noreferrer" hidden>♡ Support this project</a></div><input id="search" placeholder="Search lessons…" aria-label="Search lessons"><div class="filters" id="filters"></div><div class="grid" id="grid"></div><section class="support-box" id="supportBottom" hidden><h2>Help us create more free lessons</h2><p id="supportMessage"></p><a id="supportButton" target="_blank" rel="noopener noreferrer">♡ Make a donation</a></section></main><script id="fallback" type="application/json">{"title":"Irish Conversation Practice","subtitle":"Choose a lesson to begin practising.","donation":{"url":"https://buymeacoffee.com/officialke0","message":"All lessons are free. If you find them useful, you can support the creation of more lessons with an optional donation. Thank you!"},"lessons":[{"title":"Irregular Verb to be (bí): Closed questions","category":"General Conversation.","path":"lessons/to_be_closed_questions.html","description":"Present Simple closed questions of the Irish verb Bí (to be). An bhfuil mé/tú/sé/sí/sibh/siad\nThe 11 Irish Irregular verbs: bí (to be), déan (to make), clois/cluin (to hear), feic (to see), abair (to say), ith (to eat), téigh (to go), tar (to come), tabhair (to give), faigh (to receive),","level":"Beginner"},{"title":"Cén fáth a bhfuil tú ag caoineadh mar sin","category":"General Conversation","path":"lessons/cenfath.html","description":"1 question 7 answers.","level":""}]}</script><script>(()=>{const $=id=>document.getElementById(id);let d=JSON.parse($('fallback').textContent),category='All';function render(){document.title=d.title;$('title').textContent=d.title;$('subtitle').textContent=d.subtitle;const donation=d.donation||{},url=String(donation.url||'');const enabled=url.startsWith('https://');$('supportTop').hidden=!enabled;$('supportBottom').hidden=!enabled;if(enabled){$('supportTop').href=url;$('supportButton').href=url;$('supportMessage').textContent=String(donation.message||'These lessons are free. Your support helps create more.')}const cats=['All',...new Set(d.lessons.map(l=>l.category||'Other'))],filters=$('filters');filters.replaceChildren();cats.forEach(c=>{const b=document.createElement('button');b.textContent=c;b.className=c===category?'active':'';b.onclick=()=>{category=c;render()};filters.append(b)});const term=$('search').value.toLowerCase(),grid=$('grid');grid.replaceChildren();d.lessons.filter(l=>(category==='All'||(l.category||'Other')===category)&&[l.title,l.description,l.category,l.level].join(' ').toLowerCase().includes(term)).forEach(l=>{const card=document.createElement('article');card.className='card';const pill=document.createElement('span');pill.className='pill';pill.textContent=l.category||'Other';const h=document.createElement('h2');h.textContent=l.title;const p=document.createElement('p');p.textContent=l.description||'';const a=document.createElement('a');a.className='go';a.href=l.path;a.textContent='Open lesson →';card.append(pill,h,p,a);grid.append(card)})} $('search').oninput=render;render()})();</script></body></html>
