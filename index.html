<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Irish Conversation Practice</title><style>:root{font:16px system-ui,Segoe UI,sans-serif;color:#172235;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:28px}h1{margin:0 0 8px;font-size:clamp(30px,5vw,44px)}.sub{color:#64748b}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}.filters button{font:inherit;padding:9px 13px;background:white;border:1px solid #cbd5e1;border-radius:10px;cursor:pointer}.filters button.active{background:#234fbb;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.card{background:white;border:1px solid #dce3ee;border-radius:16px;padding:20px;box-shadow:0 8px 24px #2030520b}.card h2{font-size:20px}.card p{color:#64748b}.pill{font-size:12px;color:#234fbb;background:#eef4ff;padding:5px 9px;border-radius:15px}.go{display:inline-block;margin-top:12px;background:#234fbb;color:white;text-decoration:none;padding:10px 15px;border-radius:9px}input{padding:11px;border:1px solid #cad4e4;border-radius:9px;font:inherit;width:100%;max-width:420px;margin-top:20px}.topic-nav{margin:22px 0 4px;max-width:430px}.topic-nav>button{padding:12px 16px;border:1px solid #cad4e4;border-radius:10px;background:#fff;font:inherit;font-weight:650;cursor:pointer}.topic-nav nav{margin-top:8px;border:1px solid #dce3ee;background:white;border-radius:12px;padding:9px;box-shadow:0 6px 20px #2030520b}.topic-nav nav[hidden]{display:none}.topic-nav details{border-bottom:1px solid #edf0f5}.topic-nav details:last-child{border:0}.topic-nav summary{padding:12px 9px;cursor:pointer;font-weight:650;list-style:none;display:flex;align-items:center;gap:9px}.topic-nav summary::-webkit-details-marker{display:none}.topic-nav summary:before{content:"▸";color:#234fbb;font-size:17px}.topic-nav details[open]>summary:before{content:"▾"}.topic-nav ul{list-style:none;margin:0 0 8px 23px;padding:0}.topic-nav li a{display:block;padding:8px 10px;color:#234fbb;text-decoration:none;border-radius:6px}.topic-nav li a:hover,.topic-nav li a:focus-visible{background:#eef4ff;text-decoration:underline}.support-top{display:inline-block;margin:14px 0;color:#234fbb;font-weight:600;text-decoration:none}.support-box{margin:35px auto 0;max-width:650px;text-align:center;background:white;border:1px solid #dce3ee;border-radius:16px;padding:25px}.support-box p{color:#64748b}.support-box a{display:inline-block;padding:11px 18px;background:#234fbb;color:white;text-decoration:none;border-radius:9px}.support-box[hidden],.support-top[hidden]{display:none}</style></head><body><main class="wrap"><h1 id="title"></h1><div class="sub" id="subtitle"></div><div><a class="support-top" id="supportTop" target="_blank" rel="noopener noreferrer" hidden>♡ Support this project</a></div><div class="topic-nav"><button id="menuToggle" type="button" aria-expanded="false" aria-controls="topicMenu">☰ Browse by topic</button><nav id="topicMenu" hidden aria-label="Lessons by topic"></nav></div><section class="support-box" id="supportBottom" hidden><h2>Help us create more free lessons</h2><p id="supportMessage"></p><a id="supportButton" target="_blank" rel="noopener noreferrer">♡ Make a donation</a></section></main><script id="fallback" type="application/json">{"title":"Irish Conversation Practice","subtitle":"Choose a lesson to begin practising.","donation":{"url":"https://www.google.com/?zx=1794518663751","message":"All lessons are free. If you find them useful, you can support the creation of more lessons with an optional donation. Thank you!"},"lessons":[{"title":"L1","category":"T1","path":"lessons/nature.html","description":"Practise common greetings and introductions.","level":"Beginner"},{"title":"q1","category":"h1","path":"lessons/historyqs.html","description":"Practise common greetings and introductions.","level":"Beginner"},{"title":"historyqstwo","category":"T1","path":"lessons/historyqstwo.html","description":"Slayer","level":""}]}</script><script>(()=>{const $=id=>document.getElementById(id);let d=JSON.parse($('fallback').textContent);function render(){document.title=d.title;$('title').textContent=d.title;$('subtitle').textContent=d.subtitle;const donation=d.donation||{},url=String(donation.url||'');const enabled=url.startsWith('https://');$('supportTop').hidden=!enabled;$('supportBottom').hidden=!enabled;if(enabled){$('supportTop').href=url;$('supportButton').href=url;$('supportMessage').textContent=String(donation.message||'These lessons are free. Your support helps create more.')}} function buildTopicMenu(){const nav=$('topicMenu');nav.replaceChildren();const groups=new Map();d.lessons.forEach(l=>{const topic=String(l.category||'Other').trim()||'Other';if(!groups.has(topic))groups.set(topic,[]);groups.get(topic).push(l)});for(const [topic,items] of groups){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent=topic;details.append(summary);const ul=document.createElement('ul');for(const l of items){const li=document.createElement('li');const a=document.createElement('a');a.href=l.path;a.textContent=l.title||'Untitled lesson';li.append(a);ul.append(li)}details.append(ul);nav.append(details)}}$('menuToggle').onclick=()=>{const nav=$('topicMenu');nav.hidden=!nav.hidden;$('menuToggle').setAttribute('aria-expanded',String(!nav.hidden))};buildTopicMenu();render()})();</script></body></html>
